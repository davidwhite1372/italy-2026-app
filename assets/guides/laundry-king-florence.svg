<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b1e3f"/>
      <stop offset="0.58" stop-color="#c94f73"/>
      <stop offset="1" stop-color="#f2b84b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="1600" fill="#f8f4ef"/>
  <rect x="42" y="42" width="1116" height="1516" rx="42" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="1000" cy="185" r="120" fill="#ffffff" opacity=".13"/>
  <circle cx="1090" cy="310" r="72" fill="#ffffff" opacity=".1"/>
  <text x="100" y="150" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="4">FLORENCE TRAVEL GUIDE</text>
  <text x="100" y="260" fill="#fff" font-family="Arial, sans-serif" font-size="74" font-weight="800">Laundry King</text>
  <text x="100" y="335" fill="#fff" font-family="Arial, sans-serif" font-size="52" font-weight="700">Wash • Dry • Fold</text>
  <text x="100" y="405" fill="#fff" font-family="Arial, sans-serif" font-size="30">Same-day drop-off service with hotel delivery</text>

  <rect x="92" y="475" width="1016" height="930" rx="30" fill="#fff" opacity=".97"/>
  <text x="140" y="555" fill="#8b1e3f" font-family="Arial, sans-serif" font-size="34" font-weight="800">THE EASY MID-TRIP LAUNDRY PLAN</text>

  <circle cx="168" cy="638" r="22" fill="#8b1e3f"/><text x="158" y="649" fill="#fff" font-family="Arial" font-size="25" font-weight="700">1</text>
  <text x="215" y="650" fill="#222" font-family="Arial, sans-serif" font-size="31" font-weight="700">Drop off clothes in the morning</text>
  <text x="215" y="690" fill="#555" font-family="Arial, sans-serif" font-size="25">Full wash, dry and fold service.</text>

  <circle cx="168" cy="770" r="22" fill="#8b1e3f"/><text x="158" y="781" fill="#fff" font-family="Arial" font-size="25" font-weight="700">2</text>
  <text x="215" y="782" fill="#222" font-family="Arial, sans-serif" font-size="31" font-weight="700">Have it delivered to your hotel</text>
  <text x="215" y="822" fill="#555" font-family="Arial, sans-serif" font-size="25">Usually back neatly folded by late afternoon.</text>

  <circle cx="168" cy="902" r="22" fill="#8b1e3f"/><text x="158" y="913" fill="#fff" font-family="Arial" font-size="25" font-weight="700">3</text>
  <text x="215" y="914" fill="#222" font-family="Arial, sans-serif" font-size="31" font-weight="700">Budget by basket or bin size</text>
  <text x="215" y="954" fill="#555" font-family="Arial, sans-serif" font-size="25">Approx. €13, €18 or €25 tiers.</text>

  <line x1="140" y1="1010" x2="1060" y2="1010" stroke="#e2d8d2" stroke-width="3"/>
  <text x="140" y="1085" fill="#8b1e3f" font-family="Arial, sans-serif" font-size="30" font-weight="800">LOCATION</text>
  <text x="140" y="1130" fill="#222" font-family="Arial, sans-serif" font-size="28">Via della Scala 52-54/r</text>
  <text x="140" y="1168" fill="#555" font-family="Arial, sans-serif" font-size="24">50123 Florence</text>
  <text x="140" y="1215" fill="#8b1e3f" font-family="Arial, sans-serif" font-size="30" font-weight="800">HOURS</text>
  <text x="140" y="1258" fill="#222" font-family="Arial, sans-serif" font-size="27">Daily · 8:00 AM–9:30 PM</text>
  <text x="140" y="1310" fill="#8b1e3f" font-family="Arial, sans-serif" font-size="30" font-weight="800">DELIVERY</text>
  <text x="140" y="1353" fill="#222" font-family="Arial, sans-serif" font-size="27">About €5 in central Florence</text>

  <rect x="92" y="1450" width="1016" height="65" rx="20" fill="#fff" opacity=".95"/>
  <text x="600" y="1492" text-anchor="middle" fill="#8b1e3f" font-family="Arial, sans-serif" font-size="25" font-weight="700">laundryking.it · Verify service details before drop-off</text>
</svg>
